<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Executor Browser</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <main class="panel">
      <header class="mast">
        <p class="wordmark">executor<em>browser</em></p>
        <p class="glance" id="glance" role="status" data-state="checking">Looking for Executor…</p>
      </header>

      <form id="connectForm" class="stack">
        <label class="field">
          <span>Executor</span>
          <span class="field-row">
            <input
              id="executorUrl"
              type="text"
              inputmode="url"
              placeholder="workshop, or a full URL"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" class="ghost" id="btnDetect">Find</button>
          </span>
        </label>
        <ul class="found" id="foundList" hidden></ul>

        <label class="field">
          <span>API key</span>
          <input
            id="executorApiKey"
            type="password"
            placeholder="Personal API key"
            autocomplete="off"
          />
        </label>

        <button type="button" class="primary" id="btnConnect">Connect</button>
        <p class="hint" id="connectHint" role="status"></p>
      </form>

      <section id="connectedBar" class="connected" hidden>
        <p id="connectedWhere"></p>
        <button type="button" class="ghost" id="btnDisconnect">Disconnect</button>
      </section>

      <fieldset class="cdp">
        <legend>Developer tools</legend>
        <div class="segment" role="radiogroup" aria-label="Developer tools">
          <label><input type="radio" name="cdpMode" value="off" /> Off</label>
          <label><input type="radio" name="cdpMode" value="session" /> For a while</label>
          <label><input type="radio" name="cdpMode" value="always" /> Always on</label>
        </div>
        <p class="hint" id="cdpHint"></p>
        <div class="session" id="sessionRow" hidden>
          <span id="sessionStatus">Not allowed right now</span>
          <button type="button" class="ghost" id="btnStartSession">Allow 30 min</button>
          <button type="button" class="ghost" id="btnEndSession" hidden>Stop</button>
        </div>
      </fieldset>

      <p class="activity" id="activityLine">Idle</p>
      <footer>
        <span id="versionLabel"></span>
        <button type="button" class="text" id="btnRefresh">Check again</button>
      </footer>
    </main>
    <script src="sidebar.js" type="module"></script>
  </body>
</html>
