<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Executor Browser — Options</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body style="margin: 0; padding: 14px; max-width: 360px">
    <header class="top" style="margin-bottom: 10px">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>Options</h1>
          <p class="tag">Advanced companion URLs</p>
        </div>
      </div>
    </header>
    <p class="hint tight">
      Day-to-day setup is in the <strong>side panel</strong> (click the extension icon).
      Connect, agent prompts, and automation live there — not on a full page.
    </p>
    <div class="actions" style="margin-bottom: 12px">
      <button type="button" class="primary" id="openSide">Open side panel</button>
    </div>
    <label class="field"
      >Companion health URL
      <input id="health" type="url" autocomplete="off" />
    </label>
    <label class="field"
      >Companion MCP URL
      <input id="mcp" type="url" autocomplete="off" />
    </label>
    <label class="field"
      >Tab group title
      <input id="groupTitle" type="text" autocomplete="off" />
    </label>
    <div class="actions">
      <button id="save" class="primary" type="button">Save</button>
    </div>
    <p class="hint" id="optStatus" role="status"></p>
    <script src="options.js" type="module"></script>
  </body>
</html>
